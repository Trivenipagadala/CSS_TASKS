<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            background-color:#C5B3D3;
            display:flex;
            flex-direction:row;
            justify-content:space-between;
            align-items:center;
            height:80px;
           color:black;
        }
        a{
            text-decoration:none;
            color:black;
            margin-left:20px;
            font-size:20px;
        }
        a:hover{
            color:blue;
            font-family:lucida handwriting;
            border:2px solid black;
        }
        main{
            display:flex;    
        }
        aside{
            display:flex;
            flex-direction:column;
            gap:20px;
            background-color:#F5CBCB;
        }
        section{
            background-color:#FFE2E2;
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .card{
            text-align:center;
            width:300px;
            height:400px;
            border:2px solid black;
            border-radius:10px;
        }
        .card img{
            width:100%;
            height:70%;
            border-radius: 10px;
        }
        footer{
            background-color:#C5B3D3;
            /* text-align:center;
            height:50px;
            line-height:50px; */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            height: 50px;
        }
        .cards-container{
            display:flex;
            flex-direction:row;
            justify-content:space-around;
            align-items:center;
            gap:20px;
        }
        </style>
</head>
<body>
    <header>
        <h2>Flex-Box Layout</h2>
        <nav>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </nav>
    </header>
    <main>
        <aside>
            <h2>Dashboard</h2>
            <p>🏠Home</p>
            <p>📦Orders</p>
            <p>💬Whishlist</p>
            <p>🎁Offers</p>
            <p>📞Contact</p>
            </aside>
            <section>
                <p> main part</p>
               <div class=" cards-container">
                 <div class="card">
                    <img src="https://static1.srcdn.com/wordpress/wp-content/uploads/2025/06/03112487_poster_w780.jpg">
                    <p> tickets available</p>
                </div>
                 <div class="card">

                    <p> tickets available</p>
                </div>
                 <div class="card">
                    <img src="https://static1.srcdn.com/wordpress/wp-content/uploads/2025/06/03112487_poster_w780.jpg">
                    <p> tickets available</p>
                </div>
                </div>

                </section>
                </main>
                <footer>
                    &copy;All rights reserved</footer>
                    </body>
                    </html>
