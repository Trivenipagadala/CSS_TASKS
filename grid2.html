<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cointainer{
            width:1000px;
            height:600px;
            display:grid;
            /* border:2px solid black; */
            background-color: white;
            grid-template-columns: repeat(4, 3fr);
            gap:20px;
            border-radius: 10px;
        }
        .box{
            border: 1px solid black;
        }
        #box1{
            background-color: blueviolet;
            grid-column:1/5;
            display:flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: larger;

        }
        #box2{
            background-color: red;
            grid-column:1/3;
             display:flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: larger;

        }
        #box3{
            background-color: green;
             display:flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: larger;

        }
        #box4{
            background-color: darksalmon;
            grid-column:4;
            grid-row:2/4;
             display:flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: larger;

        }
        #box5{
            background-color: fuchsia;
             display:flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: larger;

        }
        #box6{
            background-color: mediumvioletred;
             display:flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: larger;

        }
        #box7{
            background-color: tan;
             display:flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: larger;

        }
        #box8{
            background-color: gray;
            grid-column:1/5;
             display:flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: larger;

        }
        </style>
</head>
<body>
    <div class="cointainer">
        <div class="box" id="box1">Headline</div>
        <div class="box" id="box2">News1</div>
        <div class="box" id="box3">News2</div>
        <div class="box" id="box4">Advertisements</div>
        <div class="box" id="box5">News3</div>
        <div class="box" id="box6">News4</div>
        <div class="box" id="box7">News5</div>
        <div class="box" id="box8">Footer</div>
        </div>
</body>
</html>
