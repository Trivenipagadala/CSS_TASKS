<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         body {
        background-color: #edeaea;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
         }
        .container{
            height:500px;
            width:500px;
            border:4px solid violet;
            border-radius:50%;
            display:flex;
            background-color:beige;
            justify-content:center;
            align-items:center;

        }
        .circle1{
            height:300px;
            width:300px;
            border:4px solid red;
            border-radius:50%;
            background-color:pink;
            justify-content:center;
            align-items:center;
            display:flex;    
        }
        .circle2{
            height:200px;
            width:200px;
            border:4px solid blue;
            border-radius:50%;
            background-color:lightblue;
            display:flex; 
             justify-content:center;
            align-items:center;
            text-align:center;
            font-size:10px;  
            font-family:lucida handwriting;
            text-transform:capitalize;

        }
        
        </style>
</head>
<body>
    <div class="container">
    <div class="circle1">
            <div class="circle2">
                <h2>full stack experts</h2>
                </div>
                </div>
                </div>   
    </div>
</body>
</html>
